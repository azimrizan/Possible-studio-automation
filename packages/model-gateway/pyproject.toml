[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-gateway"
version = "0.1.0"
description = "Provider-agnostic LLM gateway with structured outputs and token tracking"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]
