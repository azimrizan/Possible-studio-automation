[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-common"
version = "0.1.0"
description = "Shared SDK and defense-in-depth security layer for first-party MCP servers"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]
