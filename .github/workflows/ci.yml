name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/mcp-common -e ./packages/model-gateway
          pip install fastapi uvicorn "pydantic>=2.0" pydantic-settings "sqlalchemy>=2.0" pytest pytest-asyncio httpx pyjwt bcrypt cryptography aiosqlite python-multipart "pydantic[email]" email-validator greenlet

      - name: Run Test Suite
        run: |
          pytest tests/ -v

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web install

      - name: Build Next.js Application
        run: |
          npm --prefix apps/web run build
